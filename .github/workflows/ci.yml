name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run's result irrelevant. Without this,
# slow runs queue behind each other and the reported status lags the branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # GitHub runs PR checks against a merge of head into base *as it was when the
  # run started*. If base moves afterwards, the green tick refers to a merge
  # that no longer exists — which is how #33 and #34 both passed CI and then
  # landed together untested, having edited the same three files.
  #
  # "Require branches to be up to date" would prevent this, but it needs a paid
  # GitHub plan on a private repo. This is the free approximation, narrowed to
  # the case that actually matters: base and PR touching the SAME file. A blanket
  # is-behind-base check would redden every open PR on every push to main, and a
  # warning that fires constantly is a warning nobody reads.
  #
  # Advisory only — without branch protection no check can block a merge.
  overlap-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fail if base moved under this PR in shared files
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Explicit refspec: checkout's default config only tracks the PR ref,
          # so a bare `git fetch origin $BASE` would not create origin/$BASE.
          git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"

          merge_base=$(git merge-base HEAD "origin/${BASE}")
          git diff --name-only "$merge_base" HEAD | sort > /tmp/pr-files
          git diff --name-only "$merge_base" "origin/${BASE}" | sort > /tmp/base-files
          comm -12 /tmp/pr-files /tmp/base-files > /tmp/overlap

          if [ -s /tmp/overlap ]; then
            echo "::error::${BASE} has moved under this PR in files it also changes. Merge ${BASE} into this branch and push, so CI tests the combined state."
            echo "Files changed by BOTH this PR and ${BASE} since ${merge_base}:"
            sed 's/^/  /' /tmp/overlap
            exit 1
          fi

          echo "No shared-file drift against ${BASE} since ${merge_base}."

  # ── Static analysis ────────────────────────────────────────────────────────
  # Split from `test` and `build` so all three run concurrently. Steps use
  # `if: always()` so ONE run reports EVERY failure, rather than making you fix
  # them one push at a time.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: always()
        run: npm run lint

      - name: Module boundaries
        if: always()
        # Fences the layering the architecture audit measured as already clean
        # (zero lib→components, lib→app, components→app edges among 1,350 edges).
        run: npm run lint:boundaries

      - name: Design tokens
        if: always()
        # Ratcheting: fails only when a violation count INCREASES over the
        # committed baseline. See scripts/check-design-tokens.baseline.json.
        run: npm run lint:tokens

      - name: Data-layer confinement
        if: always()
        # Ratcheting, like the token check: 198 direct .from() call sites still
        # live outside src/lib/data, so this fails only on an INCREASE. When it
        # reaches zero, delete the script and use a real no-restricted-syntax rule.
        run: npm run lint:datalayer

      - name: Dead code (advisory)
        if: always()
        # Reports only. `knip --no-exit-code` ALWAYS exits 0, so — unlike the two
        # ratchets above — this cannot fail and the list CAN quietly grow. It is
        # here to be read in the log, not to gate. Making it a real ratchet means
        # dropping --no-exit-code and committing a baseline, which is worth doing
        # once the current findings are triaged.
        run: npm run lint:deadcode

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Must stay >= 22: jest.environment-node.js exists to strip the
          # experimental localStorage/sessionStorage globals Node 22 introduced,
          # and on Node 20 that wrapper is a no-op — so CI would never exercise
          # the path every developer machine actually takes.
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Unit + integration tests
        # `--collectCoverageFrom` is REQUIRED, not decorative. Without it Jest
        # measures only the files some test happened to import, which reported
        # 72.9% over 108 of 449 source files — a number that looks like coverage
        # and is not. With it the figure spans the whole tree.
        run: >-
          npm test -- --runInBand --coverage
          --coverageReporters=text-summary --coverageReporters=json-summary
          --collectCoverageFrom='src/**/*.{ts,tsx}'

      # ~25% of statements across the whole tree, unevenly: lib/counsellor 91%,
      # use-search-results 93%, app/profile 69% — and several directories at 0.
      # A single global threshold would be either meaningless or permanently red,
      # so this reports rather than gates. The useful gate is a per-directory
      # floor on the pure domain logic (src/lib/scoring, src/lib/matching,
      # src/features/*/model), which is where a regression is expensive and
      # coverage is already high enough to hold a line.
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              for (const k of ["statements", "branches", "functions", "lines"]) {
                console.log(k.padEnd(12), (t[k].pct + "%").padStart(7), `(${t[k].covered}/${t[k].total})`);
              }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── Build + bundle budget ──────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Placeholders — the build only needs the vars to exist; no page fetches
          # Supabase at build time (all authed routes are dynamic). src/lib/env.ts
          # is deliberately shaped so these two satisfy every REQUIRED variable.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Bundle budget
        # Reads .next/app-build-manifest.json, so it must follow the build.
        run: npm run check:bundle

  # ── Database: prove the repo can still build a database ────────────────────
  # The audit found schema.sql aborts partway (it indexes a column its own
  # CREATE TABLE never declares) and that two live tables exist in no schema file
  # at all. Nothing caught either, because nothing ever ran this SQL.
  #
  # Replaying migrations TWICE also proves they are idempotent — required here,
  # since they are applied one-off via `npm run db:apply` rather than by a tool
  # that tracks what it has already run.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v5

      - name: Stub the Supabase-only objects
        # schema.sql targets a Supabase database: it references the auth schema,
        # auth.uid()/auth.jwt(), and the service_role/authenticated/anon roles,
        # none of which exist in stock Postgres. These stubs let the DDL parse so
        # the SHAPE of the schema is verified. They do NOT emulate RLS — this job
        # proves the schema builds, not that the policies are correct.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          -- pg_trgm lives in `extensions` on Supabase but is unqualified here;
          -- installing it into public keeps unqualified opclass references resolvable.
          create extension if not exists pg_trgm;

          create schema if not exists auth;
          -- `email` is NOT optional in this stub. schema.sql:1902 and
          -- 20260801122000 both read auth.users.email, and a SQL-language function
          -- body is validated at CREATE time — so a bare (id uuid) table fails the
          -- whole run with 42703 "column u.email does not exist" before a single
          -- policy is reached. The columns here are exactly those the repo's SQL
          -- touches; this is not an attempt to model auth.users faithfully.
          create table if not exists auth.users (
            id uuid primary key,
            email text
          );
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;

          -- schema.sql:1104 inserts a bucket and policies storage.objects. Without
          -- these the run aborts at 3P01 "schema storage does not exist".
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text not null,
            public boolean default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text references storage.buckets(id),
            name text,
            owner uuid,
            created_at timestamptz default now(),
            updated_at timestamptz default now(),
            metadata jsonb
          );

          do $$ begin create role authenticated; exception when duplicate_object then null; end $$;
          do $$ begin create role anon;          exception when duplicate_object then null; end $$;
          do $$ begin create role service_role;  exception when duplicate_object then null; end $$;
          SQL

      - name: schema.sql must build a database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql

      - name: Migrations must replay, twice (idempotency)
        env:
          PGPASSWORD: postgres
        run: |
          for pass in 1 2; do
            echo "── pass $pass ──"
            for f in supabase/migrations/*.sql; do
              echo "  $f"
              psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done
          echo "All migrations replayed twice with no error."

  # ── Browser end-to-end (advisory) ──────────────────────────────────────────
  # The gate docs/audit/13-remaining-work.md blocks the StudentIntakeForm
  # decomposition on: jsdom cannot vouch for AnimatePresence exit timing, real
  # focus movement, or the beforeunload draft flush, so a six-step wizard rewrite
  # verified only in jsdom is not verified.
  #
  # It needs a REAL Supabase account, because /profile/wizard is behind
  # middleware and the alternative — a test-only bypass in src/middleware.ts —
  # would mean shipping a way to skip auth. This repo has no secrets configured,
  # so the job checks for them first and no-ops when they are absent: a check
  # that fails on every PR is a check someone deletes.
  #
  # Same "runs but is not required yet" posture as `database` below: deliberately
  # NOT in ci-ok's `needs`. Add it there the first time it goes green with real
  # secrets — set E2E_EMAIL / E2E_PASSWORD (a THROWAWAY account: the spec
  # completes the wizard and saves, overwriting that account's student_* rows)
  # plus the two NEXT_PUBLIC_SUPABASE_* vars, against a non-production project.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Are E2E secrets configured?
        id: secrets
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        run: |
          if [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E secrets are not set — skipping the browser suite. See .github/workflows/ci.yml."
          fi

      - if: steps.secrets.outputs.configured == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.secrets.outputs.configured == 'true'
        run: npm run test:e2e:install

      - name: Playwright
        if: steps.secrets.outputs.configured == 'true'
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.secrets.outputs.configured == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Aggregate gate ─────────────────────────────────────────────────────────
  # ONE check to require in branch protection. Adding a job above never means
  # touching the protection settings again — just add it to `needs`.
  #
  # `if: always()` plus the explicit result test is load-bearing: without it this
  # job is SKIPPED when a dependency fails, and GitHub counts a skipped required
  # check as PASSING.
  #
  # `database` and `e2e` are deliberately NOT in `needs` yet — see each job's own
  # header for what has to be true before it is added.
  #
  # `database`: its one known blocker (the
  # missing universities.recognition_score column) is fixed, but there is no
  # Postgres in the authoring environment, so the full replay has never actually
  # been observed green — and a required check that fails on arrival is a check
  # someone deletes. It runs and reports on every PR; add it here the first time
  # it passes, which should be this PR.
  ci-ok:
    if: always()
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          # Fail on an EMPTY list. `join` over an empty `needs` yields '', the
          # loop below iterates zero times, and this job would print success
          # having verified nothing — the same fail-open shape as a skipped
          # dependency counting as a pass.
          if [ -z "$results" ]; then
            echo "::error::ci-ok resolved no dependencies — refusing to report success."
            exit 1
          fi
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($results)"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
