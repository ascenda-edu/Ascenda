# Dependabot lives HERE, in the repo, not only in GitHub's UI settings.
#
# It was enabled through the web UI during the 2026-07-16 security-settings pass and
# that configuration was invisible to anyone reading the tree: not reviewable in a
# diff, not portable to a fork, and silently lost if the repo is transferred. This
# file is the source of truth; the UI toggle is not.
#
# Grouping is deliberate. Ungrouped, this repo produces ~15 PRs a week across
# @radix-ui/*, @tiptap/*, @typescript-eslint/* and the Next toolchain, and a
# 15-PR-a-week bot is a bot whose PRs nobody reads.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Security fixes are never grouped with anything else and never batched —
      # they should land on their own, readable, and fast.
      radix:
        patterns: ['@radix-ui/*']
      tiptap:
        patterns: ['@tiptap/*']
      # Named `lint`, not `typescript-eslint`: the patterns below also match
      # `eslint` and `eslint-config-next`, so the old name produced PR titles like
      # "bump the typescript-eslint group with 2 updates" for what was actually an
      # ESLint 10 + Next 16 toolchain major (PR #54). A group name that misdescribes
      # its own contents is how a major bump gets waved through as routine.
      lint:
        patterns: ['@typescript-eslint/*', 'eslint', 'eslint-*']
      testing:
        patterns: ['jest', 'jest-*', 'ts-jest', '@testing-library/*', '@playwright/*']
      types:
        patterns: ['@types/*']
    ignore:
      # Pinned deliberately — 1.x removes the deprecated icon aliases this codebase
      # uses app-wide. See CLAUDE.md > Gotchas. Unpin with a codemod, not a bump.
      - dependency-name: lucide-react
        versions: ['1.x']
      # `next` majors are a project, not a dependency bump (see the Next 15 + React 19
      # upgrade, PR #30). Minors and patches still come through.
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      # `eslint-config-next` majors TRACK `next` majors — 16.x carries
      # @next/eslint-plugin-next@16, which lints for APIs Next 15.5.21 does not have.
      # Ignoring `next` majors above while accepting this one was the same upgrade
      # wearing a different name.
      #
      # Proven unmergeable today, not merely risky (PR #54, closed): eslint-config-next@16
      # depends on eslint-plugin-react@^7.37.0, and 7.37.5 declares
      # `peerDependencies.eslint: "^3 || … || ^9.7"` — no ESLint 10 support at all.
      # Reproduced: `react/display-name` throws
      # `contextOrFilename.getFilename is not a function` under eslint 10.
      # Revisit as part of the Next 16 upgrade, once upstream ships an
      # ESLint-10-compatible eslint-plugin-react.
      - dependency-name: eslint-config-next
        update-types: ['version-update:semver-major']
      # ESLint majors change the config API itself. 10 removed the context shape
      # eslint-plugin-react still uses, and `eslint.config.mjs` wraps
      # eslint-config-next in FlatCompat — which cannot wrap the native flat config
      # that v16 now exports (`Converting circular structure to JSON`). Both are
      # migrations, not bumps.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # zod is pinned EXACTLY (not `^`) at 3.22.4 because `src/lib/env.ts` is
      # documented as load-bearing on zod-3 `ZodEffects` abort semantics —
      # "Verified against zod@3.22.4" — and three other modules validate with it
      # (intake-schema.ts, validation/auth.ts, api/admin/import/validation.ts).
      # A major here is a validation-behaviour change, so it goes through
      # __tests__/env.test.ts deliberately rather than arriving as a bot PR.
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      # @types/node majors track NODE majors. .nvmrc says 22 and CI reads it via
      # setup-node's node-version-file, so the types must stay on the 22 line.
      # Dependabot proposed 20.11.0 -> 26.1.2 (PR #56, closed), skipping 22, 24 and
      # 25. That direction is the dangerous one: types describing APIs the runtime
      # does not have make a green `tsc` stop meaning "this will run". Bump this
      # deliberately, in the same commit as .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # The workflow pins every action to a commit SHA (see .github/workflows/ci.yml).
  # A SHA pin does not float, so without this the actions would silently rot at
  # whatever they were pinned to. Dependabot reads the `# vN` trailing comment and
  # opens a PR that moves both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
